<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="ppc-money-title">
  <title id="ppc-money-title">PayPerCase — ธนบัตรและเหรียญค่าตอบแทน</title>
  <defs>
    <radialGradient id="money-halo" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="52%" stop-color="#F1ECFF" stop-opacity="0.86" />
      <stop offset="100%" stop-color="#EDE9FE" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="money-lavender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9FF" />
      <stop offset="48%" stop-color="#E5DBFF" />
      <stop offset="100%" stop-color="#C9B6FF" />
    </linearGradient>
    <linearGradient id="money-peach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F1" />
      <stop offset="48%" stop-color="#FFE0B2" />
      <stop offset="100%" stop-color="#FFB48F" />
    </linearGradient>
    <linearGradient id="money-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="46%" stop-color="#FDF0BE" />
      <stop offset="100%" stop-color="#F5C95A" />
    </linearGradient>
    <linearGradient id="money-coin" x1="22%" y1="6%" x2="78%" y2="94%">
      <stop offset="0%" stop-color="#FFF7D6" />
      <stop offset="38%" stop-color="#FDE68A" />
      <stop offset="72%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="note-edge-lavender" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9B6FF" />
      <stop offset="100%" stop-color="#8E75D8" />
    </linearGradient>
    <linearGradient id="note-edge-peach" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC6A0" />
      <stop offset="100%" stop-color="#D98963" />
    </linearGradient>
    <linearGradient id="note-edge-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C95A" />
      <stop offset="100%" stop-color="#B47A14" />
    </linearGradient>
    <linearGradient id="note-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#311055" stop-opacity="0" />
      <stop offset="58%" stop-color="#311055" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#311055" stop-opacity="0.16" />
    </linearGradient>
    <linearGradient id="note-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <circle cx="300" cy="226" r="222" fill="url(#money-halo)" />

  <g opacity="0.72">
    <circle cx="110" cy="170" r="5" fill="#C4B5FD" />
    <circle cx="514" cy="142" r="4" fill="#FFAB91" />
    <circle cx="528" cy="330" r="5" fill="#C4B5FD" />
    <circle cx="112" cy="352" r="4" fill="#FFAB91" />
    <path d="M82 246H96M89 239V253" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" />
    <path d="M512 232H524M518 226V238" stroke="#FFAB91" stroke-width="3" stroke-linecap="round" />
    <path d="M424 82H436M430 76V88" stroke="#FCD34D" stroke-width="3" stroke-linecap="round" />
    <path d="M182 392H192M187 387V397" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" />
    <circle cx="172" cy="112" r="3" fill="#FCD34D" />
    <circle cx="486" cy="390" r="3" fill="#C4B5FD" />
  </g>

  <!-- podium -->
  <ellipse cx="306" cy="424" rx="198" ry="30" fill="#EDE9FE" opacity="0.7" />
  <ellipse cx="306" cy="430" rx="150" ry="17" fill="#311055" opacity="0.1" />

  <!-- back note: lavender -->
  <g transform="rotate(-19 300 320)">
    <rect x="184" y="138" width="224" height="168" rx="16" fill="#311055" opacity="0.1" transform="translate(5 12)" />
    <rect x="184" y="138" width="224" height="168" rx="16" fill="url(#note-edge-lavender)" transform="translate(3 6)" />
    <rect x="184" y="138" width="224" height="168" rx="16" fill="url(#money-lavender)" />
    <rect x="184" y="138" width="224" height="168" rx="16" fill="url(#note-depth)" />
    <rect x="184" y="138" width="224" height="168" rx="16" fill="url(#note-sheen)" opacity="0.45" />
  </g>

  <!-- middle note: peach -->
  <g transform="rotate(-7 300 320)">
    <rect x="188" y="146" width="218" height="166" rx="16" fill="#311055" opacity="0.1" transform="translate(5 12)" />
    <rect x="188" y="146" width="218" height="166" rx="16" fill="url(#note-edge-peach)" transform="translate(3 6)" />
    <rect x="188" y="146" width="218" height="166" rx="16" fill="url(#money-peach)" />
    <rect x="188" y="146" width="218" height="166" rx="16" fill="url(#note-depth)" />
    <rect x="188" y="146" width="218" height="166" rx="16" fill="url(#note-sheen)" opacity="0.45" />
  </g>

  <!-- front note: gold -->
  <g transform="rotate(6 300 320)">
    <rect x="196" y="154" width="208" height="166" rx="16" fill="#311055" opacity="0.12" transform="translate(6 13)" />
    <rect x="196" y="154" width="208" height="166" rx="16" fill="url(#note-edge-gold)" transform="translate(3 7)" />
    <rect x="196" y="154" width="208" height="166" rx="16" fill="url(#money-gold)" />
    <rect x="196" y="154" width="208" height="166" rx="16" fill="url(#note-depth)" />
    <rect x="196" y="154" width="208" height="166" rx="16" fill="url(#note-sheen)" opacity="0.6" />
    <text x="300" y="256" text-anchor="middle" font-family="'IBM Plex Sans Thai','Tahoma',sans-serif" font-size="58" font-weight="700" fill="#B45309" opacity="0.65">฿</text>
  </g>

  <!-- rolling coin: enters from the left, rests, then rolls out to the right -->
  <g transform="translate(346 354)">
    <g class="coin-roll-move">
      <ellipse cx="0" cy="36" rx="30" ry="7" fill="#311055" opacity="0.16" />
      <g class="coin-roll-spin">
        <circle r="28" fill="#B45309" opacity="0.2" transform="translate(2 5)" />
        <circle r="28" fill="url(#money-coin)" />
        <circle r="28" fill="none" stroke="#D97706" stroke-width="2" opacity="0.4" />
        <circle r="20" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.55" />
        <text x="0" y="10" text-anchor="middle" font-family="'IBM Plex Sans Thai','Tahoma',sans-serif" font-size="28" font-weight="700" fill="#B45309">฿</text>
        <ellipse cx="-9" cy="-12" rx="7" ry="4" transform="rotate(-30 -9 -12)" fill="#FFFFFF" opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- coin stack -->
  <g>
    <ellipse cx="462" cy="368" rx="46" ry="13" fill="#311055" opacity="0.12" />
    <rect x="418" y="336" width="86" height="28" rx="14" fill="#D97706" />
    <ellipse cx="461" cy="336" rx="43" ry="16" fill="url(#money-coin)" />
    <rect x="418" y="318" width="86" height="28" rx="14" fill="#D97706" />
    <ellipse cx="461" cy="318" rx="43" ry="16" fill="url(#money-coin)" />
    <rect x="418" y="300" width="86" height="28" rx="14" fill="#D97706" />
    <ellipse cx="461" cy="300" rx="43" ry="16" fill="url(#money-coin)" />
    <ellipse cx="461" cy="300" rx="43" ry="16" fill="none" stroke="#D97706" stroke-width="2" opacity="0.35" />
    <text x="461" y="308" text-anchor="middle" font-family="'IBM Plex Sans Thai','Tahoma',sans-serif" font-size="24" font-weight="700" fill="#B45309">฿</text>
    <ellipse cx="444" cy="290" rx="12" ry="5" transform="rotate(-24 444 290)" fill="#FFFFFF" opacity="0.55" />
  </g>

  <!-- leaning coin -->
  <g transform="translate(408 356) rotate(-16)">
    <circle r="34" fill="#B45309" opacity="0.16" transform="translate(2 6)" />
    <circle r="34" fill="url(#money-coin)" />
    <circle r="34" fill="none" stroke="#D97706" stroke-width="2" opacity="0.4" />
    <circle r="25" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55" />
    <text x="0" y="12" text-anchor="middle" font-family="'IBM Plex Sans Thai','Tahoma',sans-serif" font-size="34" font-weight="700" fill="#B45309">฿</text>
  </g>

  <g fill="#A78BFA">
    <path d="M482 132L486 142L496 146L486 150L482 160L478 150L468 146L478 142Z" opacity="0.55" />
    <path d="M126 130L129 137L136 140L129 143L126 150L123 143L116 140L123 137Z" opacity="0.5" />
    <path d="M522 374L525 380L531 383L525 386L522 392L519 386L513 383L519 380Z" opacity="0.45" />
    <path d="M336 390L339 396L345 399L339 402L336 408L333 402L327 399L333 396Z" opacity="0.4" />
  </g>

  <style>
    .coin-roll-move {
      animation: coin-roll-move 10s linear 0.45s infinite both;
    }

    .coin-roll-spin {
      animation: coin-roll-spin 10s linear 0.45s infinite both;
      transform-origin: 0px 0px;
    }

    @keyframes coin-roll-move {
      0% {
        transform: translateX(-420px);
        opacity: 1;
        animation-timing-function: cubic-bezier(0.16, 0.84, 0.22, 1);
      }
      44% {
        transform: translateX(8px);
        opacity: 1;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      47% {
        transform: translateX(-3px);
        opacity: 1;
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      49% {
        transform: translateX(2px);
        opacity: 1;
        animation-timing-function: linear;
      }
      50% {
        transform: translateX(0);
        opacity: 1;
        animation-timing-function: linear;
      }
      80% {
        transform: translateX(0);
        opacity: 1;
        animation-timing-function: cubic-bezier(0.55, 0.06, 0.68, 0.19);
      }
      94% {
        transform: translateX(40px);
        opacity: 1;
        animation-timing-function: linear;
      }
      100% {
        transform: translateX(40px);
        opacity: 0;
      }
    }

    @keyframes coin-roll-spin {
      0% {
        transform: rotate(0deg);
        animation-timing-function: cubic-bezier(0.16, 0.84, 0.22, 1);
      }
      44% {
        transform: rotate(748deg);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      47% {
        transform: rotate(712deg);
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      49% {
        transform: rotate(724deg);
        animation-timing-function: linear;
      }
      50% {
        transform: rotate(720deg);
        animation-timing-function: linear;
      }
      80% {
        transform: rotate(720deg);
        animation-timing-function: cubic-bezier(0.55, 0.06, 0.68, 0.19);
      }
      94% {
        transform: rotate(800deg);
        animation-timing-function: linear;
      }
      100% {
        transform: rotate(800deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .coin-roll-move,
      .coin-roll-spin {
        animation: none;
      }
    }
  </style>
</svg>
